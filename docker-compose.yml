services:
  gluetun:
    image: qmcgaw/gluetun:latest@sha256:f3fb345cd365acd1d89ee0f64db55a395f9d6789036aa0d6a48d56d79ebaf214
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING}
      # LAN/Tailscale from env. Docker CIDRs are fixed here — never allowlist 10.0.0.0/8
      # (that steers PIA's 10.x port-forward API off tun0). 10.0.1.0/24 is dokploy-network;
      # 172.16.0.0/12 covers bridge/gwbridge. Prowlarr→Sonarr/Radarr uses the overlay.
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET},10.0.1.0/24,172.16.0.0/12
      - FIREWALL_INPUT_PORTS=${WEBUI_PORT},${PROWLARR_PORT}
      - TZ=${TZ}
      # Asia-safe TCP+TLS probes (IPs, not github.com/cloudflare.com hostnames).
      # qbittorrent-init/20-sync-forwarded-port.sh is the listen-port source of truth;
      # do not race qBittorrent with VPN_PORT_FORWARDING_UP_COMMAND.
      - HEALTH_TARGET_ADDRESSES=1.1.1.1:443,8.8.8.8:443
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun
      - gluetun-runtime:/tmp/gluetun
    ports:
      - "${BIND_IP}:${WEBUI_PORT}:${WEBUI_PORT}/tcp"
      - "${BIND_IP}:${PROWLARR_PORT}:${PROWLARR_PORT}/tcp"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.13-ls469
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${WEBUI_PORT}
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${MEDIA_ROOT}:/data
      - gluetun-runtime:/gluetun-runtime:ro
      - ./qbittorrent-init:/custom-cont-init.d:ro
    stop_grace_period: 10s
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11ubu2604-ls43
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_SERVER_URL}
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "127.0.0.1:8096:8096/tcp"
    networks:
      - dokploy-network
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "${BIND_IP}:8989:8989/tcp"
    networks:
      - dokploy-network
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls313
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "${BIND_IP}:7878:7878/tcp"
    networks:
      - dokploy-network
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls155
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    init: true
    environment:
      - TZ=${TZ}
    ports:
      - "${BIND_IP}:5055:5055/tcp"
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    networks:
      - dokploy-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

networks:
  dokploy-network:
    external: true

volumes:
  gluetun-runtime:
